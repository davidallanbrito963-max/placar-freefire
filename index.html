<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Placar FF">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Placar Free Fire</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--tx:#eef1f6;--mut:#8b93a3;--ac:#ff7a1a;--ok:#2fd27a;--bad:#ff4d5e;--gold:#ffc83d}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px}
header h1 span{color:var(--ac)}
.hr{display:flex;gap:8px;align-items:center}
main{padding:12px 12px 100px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:13px 4px;background:none;border:0;border-radius:0;color:var(--mut);font-size:13px;font-weight:600}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
button:active{transform:scale(.97)}
select,input:not([type=checkbox]):not([type=file]),textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.bar{display:flex;gap:8px;margin-bottom:8px}
.bar>*{flex:1}
.status{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px}
.status b{color:var(--ac)}
.status.fim{border-color:var(--gold)}
.status.fim b{color:var(--gold)}
.row{display:grid;grid-template-columns:44px 1fr auto 40px 42px;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 8px;margin-bottom:6px}
.row.dead{opacity:.62}
.row.champ{border-color:var(--gold);background:#2a2412;opacity:1}
.pos{font-weight:800;text-align:center;font-size:16px}
.pos small{display:block;font-size:9px;color:var(--ok);font-weight:600;text-transform:uppercase}
.nm{font-weight:600;min-width:0}
.nm small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:2px}
.tc{display:inline-flex;align-items:center;gap:7px;max-width:100%;vertical-align:middle}
.tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg{border-radius:8px;object-fit:contain;flex:none;background:#ffffff12}
.lg.ph{display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--mut);font-size:12px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:32px;height:32px;padding:0;font-size:18px;line-height:1}
.step b{min-width:18px;text-align:center}
.tot{font-weight:800;font-size:18px;color:var(--ac);text-align:right}
.ac button{width:38px;height:34px;padding:0;font-size:16px}
.die{background:#3a1c20;border-color:#6b2a33}
.sec{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sec button{flex:1;font-size:13px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:var(--card2);color:var(--mut);font-size:11px;text-transform:uppercase}
td.tm,th.tm{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600;max-width:160px;z-index:1}
th.tm{background:var(--card2)}
td.tot{color:var(--ac);font-weight:800;font-size:15px}
tr.top1 td,tr.top1 td.tm{background:#2a2412}
.n1{color:var(--gold);font-weight:800}
.hint{color:var(--mut);font-size:12px;margin:8px 2px}
.modal{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.modal h2{margin:0 0 10px;font-size:17px}
.modal label.l{display:block;margin:12px 0 4px;color:var(--mut);font-size:12px}
.modal h3{margin:16px 0 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
textarea{min-height:90px}
.prim{background:var(--ac);border-color:var(--ac);color:#1a0d00;font-weight:700}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.trow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.trow input{flex:1;min-width:0}
.trow .lgb{padding:3px;width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center}
.trow .sm{width:38px;height:38px;padding:0;flex:none}
.lu{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.lu input{width:22px;height:22px;flex:none;accent-color:var(--ac)}
.lu .tc{flex:1;min-width:0}
.cnt{position:sticky;top:-16px;background:var(--card);padding:6px 0;font-weight:700;color:var(--ac);z-index:2}
.sync{font-size:12px;padding:6px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.sync.ok{color:var(--ok)}
.sync.err{color:var(--bad)}
.sync.saving,.sync.conn,.sync.login{color:var(--gold)}
.sync.offline,.sync.local{color:var(--mut)}
#login:empty{display:none}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.lbox h2{margin:4px 0 0}
.lbox h2 span{color:var(--ac)}
.lbox input,.lbox button{width:100%}
.lmsg{min-height:18px;font-size:13px;color:var(--gold)}
@media(min-width:900px){
  main{max-width:980px}
  nav{left:50%;transform:translateX(-50%);max-width:980px;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}
  .modal{align-items:center}
  .modal>div{border-radius:18px}
}
</style>
</head>
<body>
<header>
  <h1>🔥 Placar <span>Free Fire</span></h1>
  <div class="hr"><span id="sync" class="sync local" data-act="syncInfo">💾 Local</span><button data-act="cfg">⚙️ Config</button></div>
</header>
<main id="app"></main>
<nav>
<button data-tab="match">🎮 Partida</button>
<button data-tab="day">📅 Tabela do Dia</button>
<button data-tab="all">🏆 Tabela Geral</button>
</nav>
<div id="modal"></div>
<div id="login"></div>
<input type="file" id="lgFile" accept="image/*" hidden>

<script src="firebase-config.js"></script>
<script>
const KEY='ffscore_v2';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newMatch=lineup=>({id:uid(),kills:{},order:[],lineup:[...lineup]});

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.teams&&s.days)return fix(s)}catch(e){}
  try{const o=JSON.parse(localStorage.getItem('ffscore_v1'));if(o&&o.teams&&o.days)return fix(o)}catch(e){}
  const teams=Array.from({length:12},(_,i)=>({id:uid(),name:'Time '+(i+1),logo:''}));
  const d={id:uid(),name:'Dia 1',matches:[newMatch(teams.map(t=>t.id))]};
  return{cfg:{pts:[12,9,8,7,6,5,4,3,2,1,0,0],kill:1},teams,days:[d],cur:{d:d.id,m:d.matches[0].id},tab:'match'};
}
function fix(s){
  const ids=s.teams.map(t=>t.id);
  s.teams.forEach(t=>{t.logo=t.logo||''});
  s.days.forEach(d=>d.matches.forEach(m=>{m.lineup=(m.lineup||ids).filter(id=>ids.includes(id));m.kills=m.kills||{};m.order=(m.order||[]).filter(id=>m.lineup.includes(id))}));
  s.cur=s.cur||{d:s.days[0].id,m:s.days[0].matches[0].id};
  s.tab=s.tab||'match';
  return s;
}
let D=load(),warned=false;

/* ---------- salvar: local sempre; nuvem quando houver login ---------- */
function saveLocal(){
  try{localStorage.setItem(KEY,JSON.stringify(D))}
  catch(e){if(!warned){warned=true;alert('Sem espaço para salvar. Use imagens menores ou faça um backup (Config).')}}
}
function save(){
  saveLocal();
  try{localStorage.setItem('ff_localts',String(Date.now()))}catch(e){}
  if(window.cloudPush)window.cloudPush();
}
function commit(){save();render()}

/* ---------- ganchos usados pelo cloud.js ---------- */
window.ffGetPayload=()=>({cfg:D.cfg,teams:D.teams,days:D.days});
window.ffHasContent=()=>D.days.some(d=>d.matches.some(started))||D.teams.some(t=>t.logo)||D.teams.length!==12;
let pendingRemote=null;
function applyRemote(o,ts){
  const cur=D.cur,tab=D.tab;
  D=fix({cfg:o.cfg,teams:o.teams,days:o.days,cur,tab});
  saveLocal();
  try{localStorage.setItem('ff_localts',String(ts))}catch(e){}
  render();
}
window.ffApplyRemote=(o,ts)=>{
  if($('#modal').innerHTML.trim()){pendingRemote={o,ts};return}
  applyRemote(o,ts);
};
let syncSt='local',syncMsg='';
window.ffSync=(s,msg)=>{
  syncSt=s;syncMsg=msg||'';
  const m={local:['💾','Local'],conn:['☁️','Conectando'],ok:['☁️','Sincronizado'],saving:['⏳','Salvando'],offline:['📴','Offline'],err:['⚠️','Erro'],login:['🔒','Entrar']}[s]||['💾','Local'];
  const e=$('#sync');if(e){e.textContent=m[0]+' '+m[1];e.className='sync '+s}
};
const cloudCfg=()=>!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey);
window.ffAuth=u=>{
  if(u){$('#login').innerHTML='';try{localStorage.removeItem('ff_skip')}catch(e){}}
  else{ffSync('login');if(!localStorage.getItem('ff_skip'))showLogin()}
};

/* ---------- login ---------- */
function showLogin(msg){
  $('#login').innerHTML=`<div class="lbox">
    <img src="icon-192.png" width="84" height="84" style="border-radius:20px" alt="">
    <h2>Placar <span>Free Fire</span></h2>
    <p class="hint">Entre para sincronizar suas tabelas entre celular e PC.</p>
    <input type="text" id="liMail" inputmode="email" autocomplete="username" autocapitalize="none" placeholder="E-mail">
    <input type="password" id="liPass" autocomplete="current-password" placeholder="Senha">
    <div class="lmsg" id="liMsg">${esc(msg||'')}</div>
    <button class="prim" data-act="liIn">Entrar</button>
    <button data-act="liUp">Criar conta</button>
    <button data-act="liReset">Esqueci a senha</button>
    <button data-act="liSkip">Continuar sem login (só neste aparelho)</button>
  </div>`;
}
async function liDo(kind){
  const mail=$('#liMail').value.trim(),pw=$('#liPass').value,msg=t=>{$('#liMsg').textContent=t};
  if(!window.Cloud){msg('A nuvem não carregou (sem internet?). Tente de novo.');return}
  if(kind==='reset'){
    if(!mail){msg('Digite seu e-mail primeiro.');return}
    try{await Cloud.reset(mail);msg('Enviamos um e-mail para redefinir a senha.')}catch(e){msg(Cloud.err(e))}
    return;
  }
  if(!mail||!pw){msg('Preencha e-mail e senha.');return}
  msg('Aguarde…');
  try{await(kind==='up'?Cloud.signUp(mail,pw):Cloud.signIn(mail,pw))}catch(e){msg(Cloud.err(e))}
}

/* ---------- núcleo de cálculo ---------- */
const T=id=>D.teams.find(t=>t.id===id);
const curDay=()=>D.days.find(d=>d.id===D.cur.d)||D.days[0];
const curMatch=()=>{const d=curDay();return d.matches.find(m=>m.id===D.cur.m)||d.matches[0]};
const started=m=>m.order.length>0||Object.values(m.kills).some(v=>v>0);
const nOf=m=>m.lineup.length;
// quem cai fica com n - ordem_de_queda; quem está vivo soma a posição provisória (= quantos ainda estão vivos)
function pos(m,id){const n=nOf(m),i=m.order.indexOf(id);return i>=0?n-i:n-m.order.length}
const posPts=p=>D.cfg.pts[p-1]||0;
function calc(m,id){
  const p=pos(m,id),k=m.kills[id]||0,pp=posPts(p);
  return{p,k,pp,t:pp+k*D.cfg.kill,champ:p===1&&nOf(m)-m.order.length===1};
}
function agg(teamList,ms){
  return teamList.map(t=>{
    const x={t,ms:[],tot:0,pp:0,k:0,b:0,g:0};
    ms.forEach(m=>{
      if(!m.lineup.includes(t.id)||!started(m)){x.ms.push(null);return}
      const c=calc(m,t.id);
      x.ms.push(c.t);x.tot+=c.t;x.pp+=c.pp;x.k+=c.k;x.g++;if(c.champ)x.b++;
    });
    return x;
  });
}
const sorter=(a,b)=>b.tot-a.tot||b.b-a.b||b.pp-a.pp||b.k-a.k||a.t.name.localeCompare(b.t.name);

/* ---------- visual do time ---------- */
function logoHtml(t,sz){
  const s=`width:${sz}px;height:${sz}px`;
  if(t.logo)return`<img class="lg" style="${s}" src="${t.logo}" alt="">`;
  return`<span class="lg ph" style="${s}">${esc((t.name||'?').trim().charAt(0).toUpperCase())}</span>`;
}
const tcell=(t,sz=26)=>`<span class="tc">${logoHtml(t,sz)}<span class="tt">${esc(t.name||'(sem nome)')}</span></span>`;

/* ---------- views ---------- */
function viewMatch(){
  const d=curDay(),m=curMatch(),n=nOf(m),al=n-m.order.length;
  let h=`<div class="bar">
    <select data-sel="day">${D.days.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <select data-sel="match">${d.matches.map((x,i)=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>Partida ${i+1}</option>`).join('')}</select>
  </div>
  <div class="bar"><button data-act="newMatch">+ Nova partida</button><button data-act="newDay">+ Novo dia</button></div>
  <div class="bar"><button class="prim" data-act="lineup">👥 Escalar times da partida (${n})</button></div>`;
  if(n<2)return h+`<div class="empty">Escale os times que jogam esta partida (normalmente 12).</div>`;
  if(al===1){
    const w=m.lineup.map(T).find(t=>t&&!m.order.includes(t.id));
    h+=`<div class="status fim"><span>🏆 Partida encerrada</span><b>${w?esc(w.name):''}</b></div>`;
  }else{
    h+=`<div class="status"><span>Vivos <b>${al}</b> de ${n}</span><span>Próxima queda: <b>${al}º</b></span></div>`;
  }
  h+=m.lineup.map(T).filter(Boolean).map(t=>{
    const c=calc(m,t.id),dead=m.order.includes(t.id);
    return`<div class="row ${dead?'dead':''} ${c.champ?'champ':''}">
      <div class="pos">${c.champ?'🏆':c.p+'º'}${(!dead&&!c.champ)?'<small>vivo</small>':''}</div>
      <div class="nm">${tcell(t,30)}<small>${c.pp} pos + ${c.k*D.cfg.kill} abates</small></div>
      <div class="step"><button data-act="k-" data-id="${t.id}">−</button><b>${c.k}</b><button data-act="k+" data-id="${t.id}">+</button></div>
      <div class="tot">${c.t}</div>
      <div class="ac">${dead?`<button data-act="rev" data-id="${t.id}">↩</button>`:(al>1?`<button class="die" data-act="die" data-id="${t.id}">☠</button>`:'')}</div>
    </div>`;
  }).join('');
  h+=`<p class="hint">Toque em ☠ quando o time cair. Quem cai fica com ${n}º, ${n-1}º… e os vivos já somam os pontos da posição atual. Abates com +/−.</p>
  <div class="sec">
    <button data-act="undo">↩ Desfazer última queda</button>
    <button data-act="resetMatch">Zerar partida</button>
    <button data-act="renDay">✏️ Renomear dia</button>
    <button data-act="delMatch">🗑 Excluir partida</button>
    <button data-act="delDay">🗑 Excluir dia</button>
  </div>`;
  return h;
}

function viewDay(){
  const d=curDay();
  const set=new Set();d.matches.forEach(m=>m.lineup.forEach(id=>set.add(id)));
  const list=D.teams.filter(t=>set.has(t.id));
  const r=agg(list,d.matches).sort(sorter);
  let h=`<div class="bar"><select data-sel="day">${D.days.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;
  if(!d.matches.some(started))h+=`<div class="empty">Nenhuma partida iniciada neste dia ainda.</div>`;
  h+=`<div class="wrap"><table><thead><tr><th>#</th><th class="tm">Time</th>${d.matches.map((_,i)=>`<th>P${i+1}</th>`).join('')}<th>🏆</th><th>Abates</th><th>Posição</th><th>Total</th></tr></thead><tbody>`;
  h+=r.map((x,i)=>`<tr class="${i===0&&x.tot>0?'top1':''}"><td class="${i===0?'n1':''}">${i+1}</td><td class="tm">${tcell(x.t,24)}</td>${x.ms.map(v=>`<td>${v===null?'–':v}</td>`).join('')}<td>${x.b}</td><td>${x.k}</td><td>${x.pp}</td><td class="tot">${x.tot}</td></tr>`).join('');
  h+=`</tbody></table></div><p class="hint">Mostra só os times escalados nas partidas deste dia. Atualiza ao vivo, inclusive a partida em andamento. Desempate: pontos, booyahs, pontos de posição, abates.</p>`;
  return h;
}

function viewAll(){
  const per=D.days.map(d=>agg(D.teams,d.matches));
  const rows=D.teams.map((t,i)=>{
    const x={t,ds:[],tot:0,pp:0,k:0,b:0,g:0};
    per.forEach(p=>{const y=p[i];x.ds.push(y.g>0?y.tot:null);x.tot+=y.tot;x.pp+=y.pp;x.k+=y.k;x.b+=y.b;x.g+=y.g});
    return x;
  }).sort(sorter);
  let h=`<div class="bar"><button data-act="teams">👥 Gerenciar times e logos (${D.teams.length})</button></div>
  <div class="wrap"><table><thead><tr><th>#</th><th class="tm">Time</th>${D.days.map(d=>`<th>${esc(d.name)}</th>`).join('')}<th>J</th><th>🏆</th><th>Abates</th><th>Posição</th><th>Total</th></tr></thead><tbody>`;
  h+=rows.map((x,i)=>`<tr class="${i===0&&x.tot>0?'top1':''}"><td class="${i===0&&x.tot>0?'n1':''}">${i+1}</td><td class="tm">${tcell(x.t,24)}</td>${x.ds.map(v=>`<td>${v===null?'–':v}</td>`).join('')}<td>${x.g}</td><td>${x.b}</td><td>${x.k}</td><td>${x.pp}</td><td class="tot">${x.tot}</td></tr>`).join('');
  h+=`</tbody></table></div><p class="hint">Todos os times do campeonato, somando todos os dias (J = partidas jogadas). Desempate: pontos, booyahs, pontos de posição, abates.</p>`;
  return h;
}

function render(){
  const d=curDay();D.cur.d=d.id;D.cur.m=curMatch().id;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===D.tab));
  $('#app').innerHTML=D.tab==='match'?viewMatch():D.tab==='day'?viewDay():viewAll();
}

/* ---------- modais ---------- */
const modal=h=>$('#modal').innerHTML=h;
function closeModal(){
  modal('');
  if(pendingRemote){
    const p=pendingRemote;pendingRemote=null;
    if(p.ts>Number(localStorage.getItem('ff_localts')||0)){applyRemote(p.o,p.ts);return}
  }
  render();
}

let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
addEventListener('appinstalled',()=>{deferredPrompt=null});

function installHtml(){
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(standalone)return`<p class="hint">✅ App instalado neste aparelho.</p>`;
  if(deferredPrompt)return`<div class="sec" style="margin-top:0"><button class="prim" data-act="install">📲 Instalar app</button></div>`;
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))return`<p class="hint">No iPhone/iPad: toque em Compartilhar e depois em “Adicionar à Tela de Início”.</p>`;
  return`<p class="hint">Para instalar: no menu do navegador escolha “Instalar app” (ou “Adicionar à tela inicial”). No PC, use o ícone de instalar na barra de endereço.</p>`;
}
function accountHtml(){
  if(!cloudCfg())return`<p class="hint">☁️ Nuvem desligada: preencha o arquivo firebase-config.js para ter login e sincronização.</p>`;
  const u=window.Cloud&&Cloud.user();
  if(u)return`<p class="hint">☁️ Conectado como <b>${esc(u.email)}</b></p><div class="sec" style="margin-top:0"><button data-act="logout">Sair da conta</button></div>`;
  return`<div class="sec" style="margin-top:0"><button class="prim" data-act="goLogin">Entrar / criar conta</button></div>`;
}

function openCfg(){
  modal(`<div class="modal" data-close="1"><div>
    <h2>⚙️ Configurações</h2>
    <h3>App</h3>${installHtml()}
    <h3>Conta e nuvem</h3>${accountHtml()}
    <h3>Campeonato</h3>
    <div class="sec" style="margin-top:0"><button class="prim" data-act="teams">👥 Gerenciar times e logos (${D.teams.length})</button></div>
    <label class="l">Pontos por posição (1º, 2º, 3º… separados por vírgula)</label>
    <input type="text" id="cPts" value="${D.cfg.pts.join(', ')}">
    <label class="l">Pontos por abate</label>
    <input type="number" id="cKill" step="any" value="${D.cfg.kill}">
    <p class="hint">Padrão: 12-9-8-7-6-5-4-3-2-1-0-0 e 1 ponto por abate.</p>
    <div class="sec"><button class="prim" data-act="cfgSave">Salvar</button><button data-act="cfgClose">Fechar</button></div>
    <h3>Backup</h3>
    <div class="sec" style="margin-top:0">
      <button data-act="export">⬇ Backup (JSON)</button>
      <button data-act="import">⬆ Importar backup</button>
      <button data-act="wipe">🗑 Zerar partidas</button>
    </div>
    <input type="file" id="cFile" accept=".json" hidden>
  </div></div>`);
}
function cfgSave(){
  const pts=$('#cPts').value.split(/[,;\s]+/).filter(Boolean).map(Number).map(v=>isNaN(v)?0:v);
  if(pts.length)D.cfg.pts=pts;
  const k=parseFloat($('#cKill').value);
  D.cfg.kill=isNaN(k)?1:k;
  save();closeModal();
}

function showTeams(){
  const old=document.querySelector('#modal .modal>div');const sc=old?old.scrollTop:0;
  modal(`<div class="modal" data-close="1"><div>
    <h2>👥 Times do campeonato</h2>
    <p class="hint">${D.teams.length} times cadastrados. Adicionar time aqui só entra na Tabela Geral — as partidas e a Tabela do Dia não mudam até você escalar o time numa partida.</p>
    ${D.teams.map(t=>`<div class="trow">
      <button class="lgb" data-act="pickLogo" data-id="${t.id}">${logoHtml(t,38)}</button>
      <input type="text" class="tn" data-id="${t.id}" value="${esc(t.name)}" placeholder="Nome do time">
      ${t.logo?`<button class="sm" data-act="rmLogo" data-id="${t.id}" title="Remover logo">🖼✕</button>`:''}
      <button class="sm" data-act="rmTeam" data-id="${t.id}">🗑</button>
    </div>`).join('')}
    <div class="sec"><button class="prim" data-act="addTeam">+ Adicionar time</button></div>
    <label class="l">Adicionar vários de uma vez (um nome por linha)</label>
    <textarea id="bulk" placeholder="Loud&#10;Fluxo&#10;LOS"></textarea>
    <div class="sec"><button data-act="addBulk">Adicionar lista</button><button class="prim" data-act="teamsClose">Concluir</button></div>
    <p class="hint">Toque no quadrado à esquerda do nome para escolher a logo da galeria.</p>
  </div></div>`);
  const nw=document.querySelector('#modal .modal>div');if(nw)nw.scrollTop=sc;
}

function openLineup(){
  const m=curMatch(),sel=new Set(m.lineup);
  modal(`<div class="modal" data-close="1"><div>
    <h2>👥 Times desta partida</h2>
    <div class="cnt" id="luCnt">${sel.size} selecionados</div>
    <div class="sec" style="margin:0 0 8px"><button data-act="luAll">Marcar todos</button><button data-act="luNone">Limpar</button></div>
    ${D.teams.map(t=>`<label class="lu"><input type="checkbox" data-lu="${t.id}" ${sel.has(t.id)?'checked':''}>${tcell(t,28)}</label>`).join('')}
    <div class="sec"><button class="prim" data-act="luSave">Salvar escalação</button><button data-act="cfgClose">Cancelar</button></div>
  </div></div>`);
}
const luCount=()=>{const c=document.querySelectorAll('[data-lu]:checked').length;const e=$('#luCnt');if(e)e.textContent=c+' selecionados'};

/* ---------- logo da galeria ---------- */
let pendingLogo=null;
function fileToLogo(file,cb){
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const S0=96,c=document.createElement('canvas');c.width=c.height=S0;
      const x=c.getContext('2d'),sc=Math.min(S0/im.width,S0/im.height),w=im.width*sc,h=im.height*sc;
      x.drawImage(im,(S0-w)/2,(S0-h)/2,w,h);
      let u=c.toDataURL('image/webp',.85);
      if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/png');
      cb(u);
    };
    im.onerror=()=>alert('Não consegui abrir essa imagem.');
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  if(e.target.dataset&&e.target.dataset.close){closeModal();return}
  const tb=e.target.closest('[data-tab]');
  if(tb){D.tab=tb.dataset.tab;saveLocal();render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,d=curDay(),m=curMatch();
  switch(a){
    case 'k+':m.kills[id]=(m.kills[id]||0)+1;break;
    case 'k-':m.kills[id]=Math.max(0,(m.kills[id]||0)-1);break;
    case 'die':if(nOf(m)-m.order.length>1&&!m.order.includes(id))m.order.push(id);break;
    case 'rev':m.order=m.order.filter(x=>x!==id);break;
    case 'undo':m.order.pop();break;
    case 'resetMatch':if(confirm('Zerar abates e quedas desta partida?')){m.kills={};m.order=[]}break;
    case 'newMatch':{const nm=newMatch(m.lineup);d.matches.push(nm);D.cur.m=nm.id;break}
    case 'newDay':{
      const name=prompt('Nome do novo dia:','Dia '+(D.days.length+1));if(!name)return;
      const nd={id:uid(),name:name.trim(),matches:[newMatch(m.lineup)]};
      D.days.push(nd);D.cur={d:nd.id,m:nd.matches[0].id};break}
    case 'renDay':{const n=prompt('Novo nome do dia:',d.name);if(n&&n.trim())d.name=n.trim();break}
    case 'delMatch':
      if(d.matches.length<2){alert('O dia precisa ter pelo menos uma partida.');return}
      if(confirm('Excluir esta partida?')){d.matches=d.matches.filter(x=>x.id!==m.id);D.cur.m=d.matches[0].id}break;
    case 'delDay':
      if(D.days.length<2){alert('Precisa existir pelo menos um dia.');return}
      if(confirm('Excluir "'+d.name+'" e todas as partidas dele?')){D.days=D.days.filter(x=>x.id!==d.id);D.cur={d:D.days[0].id,m:D.days[0].matches[0].id}}break;
    /* escalação */
    case 'lineup':openLineup();return;
    case 'luAll':document.querySelectorAll('[data-lu]').forEach(c=>c.checked=true);luCount();return;
    case 'luNone':document.querySelectorAll('[data-lu]').forEach(c=>c.checked=false);luCount();return;
    case 'luSave':{
      const ids=[...document.querySelectorAll('[data-lu]:checked')].map(c=>c.dataset.lu);
      if(ids.length<2){alert('Escale pelo menos 2 times.');return}
      if(started(m)&&!confirm('Esta partida já começou. Mudar a escalação recalcula as posições. Continuar?'))return;
      m.lineup=ids;m.order=m.order.filter(x=>ids.includes(x));
      save();closeModal();return}
    /* config */
    case 'cfg':openCfg();return;
    case 'cfgClose':closeModal();return;
    case 'cfgSave':cfgSave();return;
    case 'export':{
      const url=URL.createObjectURL(new Blob([JSON.stringify({cfg:D.cfg,teams:D.teams,days:D.days})],{type:'application/json'}));
      const l=document.createElement('a');l.href=url;l.download='placar-freefire-backup.json';l.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);return}
    case 'import':$('#cFile').click();return;
    case 'wipe':
      if(confirm('Apagar todos os dias e partidas? Os times, logos e regras são mantidos.')){
        const ids=m.lineup.length?m.lineup:D.teams.slice(0,12).map(t=>t.id);
        const nd={id:uid(),name:'Dia 1',matches:[newMatch(ids)]};
        D.days=[nd];D.cur={d:nd.id,m:nd.matches[0].id};save();closeModal();
      }return;
    /* app / conta */
    case 'install':
      if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;openCfg()})}
      return;
    case 'goLogin':modal('');try{localStorage.removeItem('ff_skip')}catch(_){}showLogin();return;
    case 'logout':{
      if(syncSt!=='ok'&&!confirm('Há alterações que ainda não foram para a nuvem. Sair mesmo assim?'))return;
      if(!confirm('Sair da conta? Seus dados continuam na nuvem e este aparelho será limpo.'))return;
      (window.Cloud?Cloud.signOut():Promise.resolve()).finally(()=>{
        ['ffscore_v2','ffscore_v1','ff_localts','ff_uid','ff_skip'].forEach(k=>localStorage.removeItem(k));
        location.reload();
      });
      return}
    case 'liIn':liDo('in');return;
    case 'liUp':liDo('up');return;
    case 'liReset':liDo('reset');return;
    case 'liSkip':try{localStorage.setItem('ff_skip','1')}catch(_){}$('#login').innerHTML='';return;
    case 'syncInfo':{
      if(syncSt==='login'){showLogin();return}
      const t={
        local:cloudCfg()?'Salvo só neste aparelho.':'Salvo só neste aparelho. Para ter login e nuvem, preencha o firebase-config.js.',
        conn:'Conectando à nuvem…',ok:'Tudo sincronizado com a nuvem.',saving:'Enviando alterações para a nuvem…',
        offline:'Sem internet. As alterações ficam salvas aqui e sobem quando a conexão voltar.',err:syncMsg||'Erro ao sincronizar.'
      }[syncSt];
      alert(t);return}
    /* times */
    case 'teams':showTeams();return;
    case 'teamsClose':closeModal();return;
    case 'addTeam':{
      D.teams.push({id:uid(),name:'Time '+(D.teams.length+1),logo:''});save();showTeams();
      const box=document.querySelector('#modal .modal>div');const ins=document.querySelectorAll('.tn');
      if(box)box.scrollTop=box.scrollHeight;if(ins.length){const l=ins[ins.length-1];l.focus();l.select()}
      return}
    case 'addBulk':{
      const names=$('#bulk').value.split('\n').map(s=>s.trim()).filter(Boolean);
      if(!names.length)return;
      names.forEach(n=>D.teams.push({id:uid(),name:n,logo:''}));save();showTeams();return}
    case 'rmTeam':{
      const t=T(id);if(!t)return;
      if(!confirm('Remover "'+t.name+'"? Ele some de todas as tabelas e partidas.'))return;
      D.teams=D.teams.filter(x=>x.id!==id);
      D.days.forEach(dd=>dd.matches.forEach(mm=>{mm.lineup=mm.lineup.filter(x=>x!==id);mm.order=mm.order.filter(x=>x!==id);delete mm.kills[id]}));
      save();showTeams();return}
    case 'pickLogo':pendingLogo=id;$('#lgFile').click();return;
    case 'rmLogo':{const t=T(id);if(t){t.logo='';save();showTeams()}return}
  }
  commit();
});
document.addEventListener('input',e=>{
  if(e.target.classList&&e.target.classList.contains('tn')){
    const t=T(e.target.dataset.id);if(t){t.name=e.target.value;save()}
  }
});
document.addEventListener('change',e=>{
  const el=e.target,s=el.dataset&&el.dataset.sel;
  if(s==='day'){D.cur.d=el.value;D.cur.m=curDay().matches[0].id;saveLocal();render()}
  if(s==='match'){D.cur.m=el.value;saveLocal();render()}
  if(el.dataset&&el.dataset.lu!==undefined)luCount();
  if(el.id==='lgFile'){
    const f=el.files[0];el.value='';
    if(!f||!pendingLogo)return;
    const id=pendingLogo;
    fileToLogo(f,u=>{const t=T(id);if(t){t.logo=u;save();showTeams()}});
  }
  if(el.id==='cFile'){
    const f=el.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{
      const j=JSON.parse(r.result);
      if(!j.teams||!j.days||!j.cfg)throw 0;
      D=fix({cfg:j.cfg,teams:j.teams,days:j.days,cur:D.cur,tab:D.tab});save();closeModal();
    }catch(_){alert('Arquivo inválido.')}};
    r.readAsText(f);
  }
});
addEventListener('offline',()=>{if(cloudCfg()&&syncSt!=='local')ffSync('offline')});

/* ---------- início ---------- */
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(cloudCfg()){
  ffSync('conn');
  import('./cloud.js').catch(()=>ffSync('local'));
}else ffSync('local');
</script>
</body>
</html>
